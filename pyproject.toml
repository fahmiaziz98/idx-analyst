[project]
name = "idx-analyst"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.17.2",
    "asyncpg>=0.31.0",
    "cohere>=5.19.0",
    "cryptography>=46.0.3",
    "fastapi==0.116.2",
    "hiredis>=3.3.0",
    "httpx==0.28.1",
    "jupyter>=1.1.1",
    "langchain==0.3.27",
    "langchain-google-genai==2.1.12",
    "langchain-groq>=0.3.8",
    "langchain-text-splitters==0.3.11",
    "langgraph==0.6.8",
    "llama-cloud-services==0.6.72",
    "loguru==0.7.3",
    "matplotlib>=3.10.7",
    "notebook>=7.4.7",
    "pandas>=2.3.3",
    "pydantic-settings==2.11.0",
    "pymupdf==1.26.4",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "python-jose[cryptography]>=3.5.0",
    "qdrant-client==1.15.1",
    "redis>=7.1.0",
    "seaborn>=0.13.2",
    "sqlalchemy[asyncio]>=2.0.43",
    "sse-starlette==1.6.5",
    "tavily-python==0.7.12",
    "tiktoken==0.11.0",
    "uvicorn[standard]==0.35.0",
    "websockets==15.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.13.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]  # Error, Formatting, Imports, Bugbear, Upgrade checks
ignore = ["E501"]  # contoh: abaikan panjang baris kalau perlu

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
